name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-profile-assets
  cancel-in-progress: true

jobs:
  generate:
    name: Generate GitHub Profile Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&hide_border=true&include_all_commits=true&count_private=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=6&theme=dark&hide_border=true
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated assets
        run: |
          echo "Checking generated profile assets..."

          if [ ! -f "profile/stats.svg" ]; then
            echo "ERROR: stats.svg was not generated."
            exit 1
          fi

          if [ ! -f "profile/languages.svg" ]; then
            echo "ERROR: languages.svg was not generated."
            exit 1
          fi

          echo "Profile assets generated successfully."

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "chore: update profile statistics"
            git push
          fi
